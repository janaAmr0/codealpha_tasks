<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALKULUS — Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene">
    <!-- Decorative background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="calculator" id="calculator" role="application" aria-label="Calculator">

      <!-- Brand strip -->
      <div class="brand-strip">
        <span class="brand-name">KALKULUS</span>
        <span class="brand-model">MK-01</span>
      </div>

      <!-- Display -->
      <div class="display-section">
        <div class="display-inner">
          <div class="display-expression" id="expression" aria-live="polite" aria-label="Expression"></div>
          <div class="display-result"   id="result"     aria-live="polite" aria-label="Result">0</div>
        </div>
        <div class="display-glow"></div>
      </div>

      <!-- History -->
      <div class="history-row" id="history-row">
        <span class="history-label">LAST</span>
        <span class="history-val" id="history-val">—</span>
      </div>

      <!-- Keyboard hint -->
      <div class="kb-hint">⌨ keyboard supported</div>

      <!-- Buttons -->
      <div class="btn-grid" id="btn-grid">

        <!-- Row 1: Clear, +/-, %, ÷ -->
        <button class="calc-btn fn-btn" data-action="clear"   aria-label="Clear">AC</button>
        <button class="calc-btn fn-btn" data-action="sign"    aria-label="Toggle sign">±</button>
        <button class="calc-btn fn-btn" data-action="percent" aria-label="Percent">%</button>
        <button class="calc-btn op-btn" data-action="op" data-op="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button class="calc-btn num-btn" data-action="num" data-num="7">7</button>
        <button class="calc-btn num-btn" data-action="num" data-num="8">8</button>
        <button class="calc-btn num-btn" data-action="num" data-num="9">9</button>
        <button class="calc-btn op-btn"  data-action="op"  data-op="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button class="calc-btn num-btn" data-action="num" data-num="4">4</button>
        <button class="calc-btn num-btn" data-action="num" data-num="5">5</button>
        <button class="calc-btn num-btn" data-action="num" data-num="6">6</button>
        <button class="calc-btn op-btn"  data-action="op"  data-op="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button class="calc-btn num-btn" data-action="num" data-num="1">1</button>
        <button class="calc-btn num-btn" data-action="num" data-num="2">2</button>
        <button class="calc-btn num-btn" data-action="num" data-num="3">3</button>
        <button class="calc-btn op-btn"  data-action="op"  data-op="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button class="calc-btn num-btn zero-btn" data-action="num" data-num="0">0</button>
        <button class="calc-btn num-btn" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="calc-btn eq-btn"  data-action="equals"  aria-label="Equals">=</button>

      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
